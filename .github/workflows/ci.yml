# CI sob demanda (ADR-012, revisado em 2026-11-13): roda SOMENTE em PR para main que toque
# áreas de alto impacto, ou manualmente (Actions → CI → Run workflow). Mudanças só de UI/docs não disparam.
name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/contracts/**'
      - 'src/server/db/**'
      - 'src/server/auth/**'
      - 'src/app/api/auth/**'
      - 'src/server/jobs/**'
      - 'src/middleware.ts'
      - 'db/migrations/**'
      - 'scripts/db/**'
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'drizzle.config.ts'
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      build:
        description: 'Executar também o next build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, contratos e unidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run test:contracts
      - run: npm run test:auth
      - run: npm run test:unit

  banco:
    name: Migrations, banco e autenticação (PostgreSQL 16 + Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_SUPERUSER: postgres://postgres:postgres_ci@localhost:5432/postgres
      DB_NAME: nett_licita_ci
      DB_APP_PASSWORD: app_ci
      DB_MIGRATOR_PASSWORD: migrator_ci
      DATABASE_URL_MIGRATOR: postgres://nett_migrator:migrator_ci@localhost:5432/nett_licita_ci
      DATABASE_URL_TEST: postgres://nett_app:app_ci@localhost:5432/nett_licita_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:bootstrap
      - run: npm run db:migrate
      - name: Migrations idempotentes
        run: npm run db:migrate
      - run: npm run test:db
      - name: Keycloak local (realm de docker/keycloak)
        run: |
          docker run -d --name keycloak -p 8180:8180 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin_ci -e KC_HEALTH_ENABLED=true \
            -v "$PWD/docker/keycloak/realm-nett.json:/opt/keycloak/data/import/realm-nett.json:ro" \
            quay.io/keycloak/keycloak:26.4.2 start-dev --import-realm --http-port=8180
          for i in $(seq 1 60); do curl -sf http://localhost:9000/health/ready >/dev/null && exit 0; sleep 3; done
          docker logs keycloak | tail -50; exit 1
      - name: Autenticação (Postgres + Keycloak)
        run: npm run test:auth:integration
        env:
          KEYCLOAK_TEST: '1'
      - name: Schema sem migration pendente
        run: |
          npx drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::src/server/db/schema.ts mudou sem migration. Rode npm run db:generate e commite."
            git status --porcelain db/migrations
            exit 1
          fi

  build:
    name: Build Next.js
    if: github.event_name == 'workflow_dispatch' && inputs.build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
